[theme]
base = "dark"
primaryColor = "#6c8cff"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#111827"
textColor = "#e6eaf2"
borderColor = "#243049"
baseRadius = "0.75rem"
font = "sans-serif"

[theme.sidebar]
backgroundColor = "#0d121d"
secondaryBackgroundColor = "#172033"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
port = 8501

[browser]
gatherUsageStats = false
